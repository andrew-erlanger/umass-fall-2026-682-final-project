[project]
name = "gnn-rerank"
version = "0.1.0"
description = "Reranking retrieved passages for multi-hop QA: cross-encoder vs GNN"
readme = "README.md"
authors = [
    { name = "Andrew Erlanger", email = "andrew.erlanger@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "sentence-transformers>=6.2.0",
    "torch",
    "torch-geometric>=2.8.1",
    "transformers>=5.22.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbstripout>=0.9.1",
]
